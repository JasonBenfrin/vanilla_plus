name: Deploy to Pebblehost

permissions:
  contents: write

on:
  push:
    branches: main
    paths: ["datapack/**"]

jobs:
  datapack:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Upload Datapack
      uses: Dylan700/sftp-upload-action@latest
      with:
        server: ${{secrets.PEBBLEHOST_SFTP_URL}}
        port: ${{secrets.PEBBLEHOST_SFTP_PORT}}
        username: ${{secrets.PEBBLEHOST_SFTP_USERNAME}}
        password: ${{secrets.PEBBLEHOST_SFTP_PASSWORD}}
        uploads: |
          ./datapack/ => ./world/datapacks/vanilla_plus/
        ignore: |
          *.git
    
    - name: Reload Datapacks
      run: |
        curl \
          --fail-with-body \
          --request POST \
          --location 'https://panel.pebblehost.com/api/client/servers/${{secrets.PEBBLEHOST_SERVER_ID}}/command' \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: Bearer ${{secrets.PEBBLEHOST_API_KEY}}' \
          --data '{"command": "reload"}'